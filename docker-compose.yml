# চালু করতে: cp .env.example .env  (মান বদলান)  →  docker compose up -d --build
# Atlas (ক্লাউড MongoDB) ব্যবহার করলে এই ফাইল লাগবে না; শুধু MONGODB_URI দিয়ে `npm start`।
services:
  db:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongodata:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 5s, retries: 10 }
  api:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      MONGODB_URI: mongodb://db:27017
      MONGODB_DB: madrasa
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET সেট করুন (৩২+ অক্ষর)}
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports: ["3000:3000"]
  backup:   # প্রতিদিন ডেটাবেজ ব্যাকআপ (./backups ফোল্ডারে, ৩০ দিন রাখে)
    image: mongo:7
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    volumes: ["./backups:/backups"]
    entrypoint: ["sh", "-c", "while true; do mongodump --host db --db madrasa --archive=/backups/madrasa-$$(date +%F).archive --gzip; find /backups -name '*.archive' -mtime +30 -delete; sleep 86400; done"]
volumes:
  mongodata:

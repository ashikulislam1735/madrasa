# Render Blueprint: রিপোর backend ফোল্ডার থেকে API চালু করে। ডেটাবেজ MongoDB Atlas (আলাদা)।
services:
  - type: web
    name: madrasa-api
    runtime: node
    rootDir: backend
    plan: free            # সার্বক্ষণিক চালু রাখতে paid প্ল্যান (starter) নিন
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:init && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false       # Atlas-এর connection string এখানে বসাবেন
      - key: MONGODB_DB
        value: madrasa
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false       # Vercel-এর ঠিকানা, যেমন https://madrasa.vercel.app
